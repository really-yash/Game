name: Auto Arrange Game Files

on:
  push:
    branches:
      - main

jobs:
  arrange:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move files to correct folders
        run: |
          # Create the necessary folders inside config
          mkdir -p config/server config/client
          
          # Move index.js to server folder
          mv index.js config/server/ 2>/dev/null || true
          mv config/index.js config/server/ 2>/dev/null || true
          
          # Move client files to client folder
          mv index.html config/client/ 2>/dev/null || true
          mv config/index.html config/client/ 2>/dev/null || true
          
          mv game.js config/client/ 2>/dev/null || true
          mv config/game.js config/client/ 2>/dev/null || true
          
          mv style.css config/client/ 2>/dev/null || true
          mv config/style.css config/client/ 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: organize server and client files" || echo "No changes to commit"
          git push
