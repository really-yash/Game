name: Arrange Files Automatically

on:
  workflow_dispatch: # Allows you to run it manually from the Actions tab
  push:
    branches:
      - main # Change to 'master' if your default branch is master

jobs:
  organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Folders and Move Files
        run: |
          # 1. Create target directories
          mkdir -p src/js src/css src/html assets/images assets/docs config scripts

          # 2. Organize Web & Source Files (ignoring root index.html if you want it kept at root)
          find . -maxdepth 1 -name "*.js" ! -name ".*" -exec mv {} src/js/ \; || true
          find . -maxdepth 1 -name "*.css" -exec mv {} src/css/ \; || true
          # To keep root index.html at root, move other html files:
          find . -maxdepth 1 -name "*.html" ! -name "index.html" -exec mv {} src/html/ \; || true

          # 3. Organize Assets & Media
          find . -maxdepth 1 \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.svg" -o -name "*.gif" -o -name "*.webp" \) -exec mv {} assets/images/ \; || true
          find . -maxdepth 1 \( -name "*.pdf" -o -name "*.docx" -o -name "*.txt" \) ! -name "README.md" ! -name "LICENSE" -exec mv {} assets/docs/ \; || true

          # 4. Organize Configs & Utility Scripts
          find . -maxdepth 1 \( -name "*.json" -o -name "*.yaml" -o -name "*.yml" -o -name "*.toml" \) ! -path "./.github/*" -exec mv {} config/ \; || true
          find . -maxdepth 1 \( -name "*.sh" -o -name "*.py" -o -name "*.lua" \) -exec mv {} scripts/ \; || true

          # Remove empty created directories if no matching files were found
          find src assets config scripts -type d -empty -delete 2>/dev/null || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit if there are actual changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-arrange files into directories"
            git push
          else
            echo "All files are already organized."
          fi
